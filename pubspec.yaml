name: polar_saver
description: Polar Saver - Open-source Android battery manager, duplicate file finder, and device health utility.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^6.2.1
  crypto: ^3.0.6
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/polar_saver_icon.png"
  adaptive_icon_background: "#1E40AF"
  adaptive_icon_foreground: "assets/icon/polar_saver_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/polar_saver_icon.png
